# Content-only mod: "lowcodefml" lets NeoForge load a mod that has no Java classes.
modLoader = "lowcodefml"
loaderVersion = "[1,)"
license = "MPL-2.0"
issueTrackerURL = "https://github.com/ellecat5112/CobbleEffort/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "ellecat5112"
logoFile = "assets/${mod_id}/icon.png"
description = '''
Extra cosmetic forms for Cobblemon.
Backrooms: 18 evolutionary lines as "Still Life" copies (Yellow Carpet in the cosmetic slot).
Thanksgiving: 18 evolutionary lines in harvest colours (Pumpkin Pie in the cosmetic slot).
Halloween: 18 evolutionary lines as animated gory nightmares (Carved Pumpkin in the cosmetic slot).
Christmas: 18 evolutionary lines incl. Santa Snorlax, Christmas-tree Turtwig, gift Trubbish and Krampus Phantump (Snowball in the cosmetic slot).
Easter: 18 evolutionary lines incl. Easter-egg Togepi and Easter Bunny Lopunny (Egg in the cosmetic slot).
Five Nights at Freddy's: 18 evolutionary lines as animatronics, incl. Freddy Teddiursa, Chica Torchic and Foxy Sandile (Clock in the cosmetic slot).
Ice Sculptures: 18 evolutionary lines carved from ice, with twinkling glints (Ice, Packed Ice or Blue Ice in the cosmetic slot).
'''

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range_neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "${cobblemon_range_neoforge}"
ordering = "AFTER"
side = "BOTH"
