# "javafml": the mod has one Java class for NeoForge (io.github.cobbleeffort.neoforge.CobbleEffortNeoForge, the
# creative tab); everything else is data and assets.
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MPL-2.0"
issueTrackerURL = "https://github.com/ellecat5112/CobbleEffort/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "ellecat5112"
logoFile = "assets/${mod_id}/icon.png"
description = '''
Extra cosmetic forms for Cobblemon.
Backrooms: 18 evolutionary lines as "Still Life" copies (Yellow Carpet in the cosmetic slot).
Thanksgiving: 18 evolutionary lines in harvest colours (Pumpkin Pie in the cosmetic slot).
Halloween: 18 evolutionary lines as animated gory nightmares (Carved Pumpkin in the cosmetic slot).
Christmas: 18 evolutionary lines incl. Santa Snorlax, Christmas-tree Turtwig, gift Trubbish and Krampus Phantump (Snowball in the cosmetic slot).
Easter: 18 evolutionary lines incl. Easter-egg Togepi and Easter Bunny Lopunny (Egg in the cosmetic slot).
Five Nights at Freddy's: 18 evolutionary lines as animatronics, incl. Freddy Teddiursa, Chica Torchic and Foxy Sandile (Clock in the cosmetic slot).
Ice Sculptures: 18 evolutionary lines carved from ice, with twinkling glints (Ice, Packed Ice or Blue Ice in the cosmetic slot).
Stone Statues: 18 evolutionary lines as weathered stone statues, shinies in marble (Stone, Smooth Stone or Chiseled Stone Bricks in the cosmetic slot).
Naruto: 18 evolutionary lines as shinobi, incl. Kurama Ninetales and Sasuke Xurkitree (Flint in the cosmetic slot).
Trans Pride: 18 evolutionary lines wearing the transgender pride flag head to toe (a Light Blue, Pink or White Banner in the cosmetic slot).
New Pokémon: Iron Boulder (#1022) and Celesteela (#797), roaming legendaries with their own models and animations.
Paradox megas (with Mega Showdown): Mega Evolutions for the Paradox Pokémon, with craftable mega stones.
Creative inventory: every item the mod uses is in the CobbleEffort tab.
'''

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range_neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "${cobblemon_range_neoforge}"
ordering = "AFTER"
side = "BOTH"
