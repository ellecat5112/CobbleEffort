plugins {
    id "dev.architectury.loom" version "1.10.455" apply false
    id "architectury-plugin" version "3.4.164"
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url "https://maven.impactdev.net/repository/development/" }   // Cobblemon
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.wispforest.io/releases/" }                 // Accessories
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = "UTF-8"
    }
}

// Every jar is delivered in a zip (with the player guide): build/libs/cobbleeffort-distortion-<version>.zip
tasks.register("distZip", Zip) {
    group = "build"
    description = "Zips the Fabric and NeoForge jars with the README."
    dependsOn ":fabric:remapJar", ":neoforge:remapJar"
    archiveFileName = "${rootProject.archives_name}-${rootProject.mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir("libs")
    from(project(":fabric").tasks.named("remapJar"))
    from(project(":neoforge").tasks.named("remapJar"))
    from("README.txt") { filter { it.replace("@VERSION@", rootProject.mod_version) } }
    from("LICENSE.txt")
}
tasks.register("build") { dependsOn "distZip" }
