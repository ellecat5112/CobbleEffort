architectury {
    common rootProject.enabled_platforms.split(",")
}

dependencies {
    // Fabric loader for @Environment etc.; the common code itself uses only vanilla + Architectury
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    modCompileOnly("com.cobblemon:mod:$rootProject.cobblemon_version") { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}
